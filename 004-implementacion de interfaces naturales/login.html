<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>mavr | login</title>
  <link rel="shortcut icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body class="mv-login-pagina">
  <main class="mv-login">
    <article class="mv-login-marca">
      <img src="img/logo.svg" alt="">
      <h1>mavr | interfaz integrada</h1>
      <p>Accede a tu espacio de trabajo.</p>
    </article>
    <article class="mv-login-tarjeta">
      <h2>Iniciar sesión</h2>
      <p>Introduce tus credenciales.</p>
      <form class="mv-form" action="index.html">
        <label class="mv-form-completo">
          <span>Email</span>
          <input type="email" required placeholder="nombre@ejemplo.com" autocomplete="username">
        </label>
        <label class="mv-form-completo">
          <span>Contraseña</span>
          <input type="password" required placeholder="••••••••" autocomplete="current-password">
        </label>
        <label class="mv-check mv-form-completo">
          <input type="checkbox">
          <span>Mantener la sesión iniciada</span>
        </label>
        <div class="mv-form-completo mv-login-acciones">
          <button class="mv-btn" type="submit">Entrar</button>
          <a class="mv-enlace" href="#">¿Olvidaste la contraseña?</a>
        </div>
      </form>
    </article>
  </main>
</body>
</html>
