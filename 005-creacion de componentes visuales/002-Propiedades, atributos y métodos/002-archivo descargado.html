<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>mavr | mavr-ui · versión 1</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="../img/logo.svg" type="image/svg+xml">
  <!-- estilo mavr: va al final del head para sobrescribir los estilos del ejercicio -->
  <link rel="stylesheet" href="../css/ejercicios.css">
</head>
<body class="mv-ej">
<header class="mv-ej-cabecera"><img src="../img/logo.svg" alt=""><span class="marca">mavr | componentes visuales</span><h1>mavr-ui · versión 1</h1><a class="mv-ej-volver" href="../index.html">← Ejercicios</a></header>
<main class="mv-ej-contenido">

  <form action="procesa.php" method="POST">
    <p><input type="text" name="nombre" placeholder="Nombre"></p>

    <h2>Editor rico</h2>
    <mavr-texto name="mensaje"><p>Hola <b>mundo</b></p></mavr-texto>

    <h2>Markdown</h2>
    <mavr-markdown name="documentacion"># Título

Texto con **negrita** y *cursiva*.</mavr-markdown>

    <h2>Editor de código</h2>
    <mavr-editor name="codigo" language="javascript">function hola(){
  console.log("Hola mundo");
}</mavr-editor>

    <h2>Firma</h2>
    <mavr-firma name="firma"></mavr-firma>

    <p><button type="submit">Enviar formulario</button></p>
  </form>
  <script src="mavr-ui.js"></script>
</main>
</body>
</html>
