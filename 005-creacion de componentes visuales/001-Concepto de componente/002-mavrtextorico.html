<!doctype html>
<html lang="es">
  <head>
  <meta charset="UTF-8">
    <style>
      .mavr-texto article{
      	width:400px;
        height:400px;
        border:1px solid grey;
      }
    </style>
    <title>mavr | Etiqueta propia &lt;mavr-texto&gt;</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="../img/logo.svg" type="image/svg+xml">
  <!-- estilo mavr: va al final del head para sobrescribir los estilos del ejercicio -->
  <link rel="stylesheet" href="../css/ejercicios.css">
</head>
  <body class="mv-ej">
<header class="mv-ej-cabecera"><img src="../img/logo.svg" alt=""><span class="marca">mavr | componentes visuales</span><h1>Etiqueta propia &lt;mavr-texto&gt;</h1><a class="mv-ej-volver" href="../index.html">← Ejercicios</a></header>
<main class="mv-ej-contenido">

    <mavr-texto></mavr-texto>
  </main>
</body>
  <script>
    let elementos = document.querySelectorAll("mavr-texto");
		elementos.forEach(function(elemento){
    	let elementoenmemoria = elemento
      let contenedor = document.createElement("div")
      contenedor.classList.add("mavr-texto")
      elementoenmemoria.after(contenedor);
      elemento.remove()
      let contenedor_rico = document.createElement("article")
      let contenedor_pobre = document.createElement("textarea")
      contenedor.appendChild(contenedor_rico)
      contenedor.appendChild(contenedor_pobre)
      contenedor_pobre.style.display = "none"
      contenedor_rico.setAttribute("contenteditable",true)
    })
  </script>
</html>
