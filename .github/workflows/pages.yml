# Copia este archivo en cada proyecto como .github/workflows/pages.yml
# Toda la lógica está en el repositorio miguelvarro/publicador-pages.

name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publicar:
    uses: miguelvarro/publicador-pages/.github/workflows/publicar.yml@main
